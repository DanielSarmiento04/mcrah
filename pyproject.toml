[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrah"
version = "0.1.0"
description = "Motion-Coherent Rigidity-Adaptive Hypergraph for drift-stable Dynamic 3D Gaussian Splatting (CVPR 2027)"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "opencv-python",
    "numpy",
    "lpips",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
